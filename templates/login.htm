<!doctype html>
<html>
    <head>
        <title>Login</title>
    </head>
    <body>
        <h1>Login to Threads</h1>
        <form method="post" action="/login">
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            /><br />
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            /><br />
            <button type="submit">Login</button>
        </form>
        <p><a href="/">Back to Threads</a></p>
    </body>
</html>
