<!doctype html>
<html>
    <head>
        <title>Threads Blog</title>
    </head>
    <body>
        <h1>Welcome to Threads</h1>
        <ul>
            {% for post in posts %}
            <li>
                <a href="/posts/{{ post.slug }}">{{ post.title }}</a>
                <small>Published: {{ post.published_at or 'Draft' }}</small>
            </li>
            {% endfor %}
        </ul>
    </body>
</html>
