name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_threads_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff
        pip install -r requirements.txt
    
    - name: Lint with ruff
      run: |
        ruff check .
    
    - name: Set up test database
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE test_threads_db;" -p 5432
        psql -h localhost -U postgres -d test_threads_db -f db/ddl/threads_pg_ddl.sql -p 5432
      env:
        PGPASSWORD: postgres
    
    - name: Test with pytest
      run: |
        pytest --cov=./ --cov-report=xml
      env:
        DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/test_threads_db
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

